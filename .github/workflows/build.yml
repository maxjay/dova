# Every push: test on Linux and Windows, and build both installers.
# A tag like v0.3.0: also publish them as a GitHub release.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    # The oldest Ubuntu on offer, so the .deb runs on that and everything newer (WSL included).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo install cargo-deb --locked
      - run: cargo deb --locked
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/debian/*.deb
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal; rustup default stable
      - run: cargo test --locked
      - run: dotnet tool install --global wix --version 5.0.2
      - run: ./packaging/build-msi.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: target/*.msi
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" *.deb *.msi --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
