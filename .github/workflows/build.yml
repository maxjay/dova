# Every pull request, and every push to main: check and test on Linux and
# Windows. The installers are not built here: release.yml builds them when
# they are wanted, which is a release, or a change to how they are made.
name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nothing here is built twice from one checkout, and what it would keep is most of what gets cached.
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    # The same Ubuntu the .deb is built on.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - id: rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
          echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # Everything dova is built from, already built: only dova itself is compiled.
      # A new compiler or a changed Cargo.lock starts from the nearest older cache.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: checks-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: checks-${{ runner.os }}-${{ steps.rust.outputs.version }}-
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - id: rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: checks-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: checks-${{ runner.os }}-${{ steps.rust.outputs.version }}-
      - run: cargo test --locked
