# A tag like v0.3.0: test, build both installers, publish them as a GitHub
# release, and on dova.maxjay.dev (site.yml).
#
# A pull request that changes how the installers are made builds them too,
# without publishing anything, so a broken one is found before the release.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - packaging/**
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing is cached here: a tag's run can only read what a run on main saved,
# and nothing on main builds a release.

jobs:
  deb:
    # The oldest Ubuntu on offer, so the .deb runs on that and everything newer (WSL included).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # A release is tested once more, on the machine that builds it.
      - run: cargo test --locked
      - run: cargo install cargo-deb --locked
      - run: cargo deb --locked
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: target/debian/*.deb
          if-no-files-found: error

  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal; rustup default stable
      - run: cargo test --locked
      - run: dotnet tool install --global wix --version 5.0.2
      - run: ./packaging/build-msi.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: msi
          path: target/*.msi
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" *.deb *.msi --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # The release's installers go up on dova.maxjay.dev, with the page.
  site:
    needs: release
    uses: ./.github/workflows/site.yml
    secrets: inherit
